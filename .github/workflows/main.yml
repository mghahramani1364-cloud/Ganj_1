name: Build Web APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          unzip "GanjineDanayi_MohammadAli_FINAL_REDESIGNED_UNDER_25MB.zip" -d ./www

      - name: Build APK
        uses: samuelcustos/web-to-apk-action@v1
        with:
          app-name: "Ganjine Danayi"
          package-name: "com.ganjine.danayi"
          version-name: "1.0.0"
          version-code: "1"
          website-url: "file:///android_asset/www/index.html"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
