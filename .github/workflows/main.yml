name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project
      run: |
        unzip "GanjineDanayi_MohammadAli_FINAL_REDESIGNED_UNDER_25MB.zip" -d ./project

    - name: Build with Gradle
      run: |
        cd ./project
        # بررسی اینکه آیا پروژه ساختار اندروید دارد یا خیر
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        elif [ -f "android/gradlew" ]; then
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "خطا: فایل gradlew پیدا نشد. این فایل زیپ احتمالا یک پروژه استاندارد اندروید استودیو نیست."
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          ./project/app/build/outputs/apk/debug/*.apk
          ./project/android/app/build/outputs/apk/debug/*.apk
