name: Build APK from ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify and Extract Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="GanjineDanayi_MohammadAli_FINAL_REDESIGNED_UNDER_25MB.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP was not found in repository root."
            exit 1
          fi

          unzip -t "$ZIP_FILE"
          mkdir -p extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project

      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER="$(find extracted_project -type f -name gradlew -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew was not found in the ZIP."
            echo "The archive may not contain a complete Android project."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file was not found."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        shell: bash
        working-directory: .
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GanjineDanayi-MohammadAli-APK
          path: extracted_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
