name: Build Web APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        unzip "GanjineDanayi_MohammadAli_FINAL_REDESIGNED_UNDER_25MB.zip" -d ./web_project

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK using WebView Template
      uses: tsobis/android-webview-app@v1
      with:
        app-name: "Ganjine Danayi"
        package-name: "com.ganjine.danayi"
        web-dir: "./web_project"
        # اینجا نام فایل اصلی وب‌سایت شماست. اگر اسمش چیز دیگری است، تغییرش دهید
        start-page: "index.html" 
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: ${{ steps.build.outputs.apk-path }}
